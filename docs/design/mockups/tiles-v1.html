<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Орбита — плитки «Сегодня»: стили иллюстраций (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131315; --s1:#1B1B1E; --s2:#212124; --s3:#2A2A2E; --line:rgba(255,255,255,.07);
    --text:#EDEDEF; --text-2:#9A9AA2; --text-3:#7E7E87; --accent:#8B8EFF;
    --amber:#E0A75E; --violet:#8F8DF7; --teal:#52BBAA; --rose:#E58091; --sky:#6AA9F2; --green:#4FCB85; --lilac:#C69CF0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Onest",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .page{max-width:1180px;margin:0 auto;padding:44px 40px 80px}
  h1{font-size:34px;font-weight:500;letter-spacing:-.03em}
  section{margin-top:56px}
  h2{font-size:18px;font-weight:600;letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline}
  h2 small{font-size:14px;font-weight:400;color:var(--text-3)}
  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:16px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px;font-weight:500;letter-spacing:-.01em;cursor:pointer}
  .face{--face:var(--s1);display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:24px;background:var(--face);overflow:hidden;transition:background .2s}
  .face svg{width:64%;height:auto;transition:transform .45s cubic-bezier(.34,1.35,.5,1)}
  .tile:hover .face{background:var(--s2);--face:var(--s2)}
  .tile:hover .face[style]{filter:brightness(1.12)}
  .tile:hover .face svg{transform:translateY(-2px) scale(1.06)}
  @media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:640px){.page{padding:24px 16px 60px}.grid{gap:12px}.tile{font-size:14px}}
</style>
</head>
<body>
<main class="page">
  <h1>Плитки «Сегодня»</h1>
  <div id="root"></div>
</main>

<script>
const LABELS = ["Мои курсы", "Оценки", "Справки", "Студбилет", "Преподаватели", "Библиотека"];
let uid = 0; const id = (p) => `${p}${++uid}`;
const svg = (body) => `<svg viewBox="0 0 120 100" aria-hidden="true">${body}</svg>`;

/* ---------------- A. Стекло ---------------- */
function lg(c1, c2, a = 0, b = 1) { const g = id("g"); return [g, `<linearGradient id="${g}" x1="0" y1="${a}" x2="0" y2="${b}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`]; }
function glassShadow() { const f = id("f"); return [f, `<filter id="${f}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`]; }
function hl(x, y, w, h, r) { return `<rect x="${x}" y="${y}" width="${w}" height="${h / 2}" rx="${r}" fill="#fff" opacity=".18"/>`; }
const glass = [
  () => { const [a, da] = lg("#B6B4FF", "#6F6CE8"), [b, db] = lg("#7FE0CF", "#3B9F8E"), [c, dc] = lg("#F3C68A", "#C98A3E"), [f, df] = glassShadow();
    return svg(`<defs>${da}${db}${dc}${df}</defs><ellipse cx="60" cy="88" rx="34" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>
      <g transform="rotate(-13 44 58)"><rect x="24" y="24" width="42" height="56" rx="9" fill="url(#${b})"/>${hl(24,24,42,56,9)}</g>
      <g transform="rotate(10 78 58)"><rect x="56" y="22" width="42" height="56" rx="9" fill="url(#${c})"/>${hl(56,22,42,56,9)}</g>
      <rect x="38" y="16" width="44" height="62" rx="9" fill="url(#${a})"/>${hl(38,16,44,62,9)}
      <rect x="38.5" y="16.5" width="43" height="61" rx="8.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
      <rect x="46" y="28" width="24" height="4" rx="2" fill="#fff" opacity=".95"/><rect x="46" y="36" width="16" height="4" rx="2" fill="#fff" opacity=".55"/>`); },
  () => { const [g, dg] = lg("#7BE3A6", "#2EA866"), [f, df] = glassShadow(), [card, dcard] = lg("rgba(255,255,255,.16)", "rgba(255,255,255,.05)");
    return svg(`<defs>${dg}${df}${dcard}</defs><ellipse cx="58" cy="88" rx="34" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>
      <rect x="16" y="20" width="78" height="62" rx="12" fill="url(#${card})" stroke="#fff" stroke-opacity=".18"/>
      <rect x="27" y="30" width="28" height="4" rx="2" fill="#fff" opacity=".45"/>
      ${[[30,56,16],[43,50,22],[56,45,27]].map(([x,y,h])=>`<rect x="${x}" y="${y}" width="9" height="${h}" rx="3" fill="#fff" opacity=".28"/>`).join("")}
      <rect x="69" y="38" width="9" height="34" rx="3" fill="url(#${g})"/>
      <circle cx="95" cy="24" r="15" fill="url(#${g})"/><circle cx="95" cy="24" r="14.5" fill="none" stroke="#fff" stroke-opacity=".4"/>
      <text x="95" y="29.5" text-anchor="middle" font-family="Onest" font-weight="600" font-size="15" fill="#fff">8</text>`); },
  () => { const [p, dp] = lg("#F7F7F9", "#C9CAD2"), [s, ds] = lg("#8FC4FF", "#3E86E0"), [f, df] = glassShadow();
    return svg(`<defs>${dp}${ds}${df}</defs><ellipse cx="60" cy="88" rx="30" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>
      <rect x="42" y="14" width="44" height="62" rx="8" fill="#fff" opacity=".18" transform="rotate(7 64 45)"/>
      <rect x="32" y="18" width="46" height="64" rx="8" fill="url(#${p})"/>
      <rect x="40" y="29" width="24" height="4" rx="2" fill="#9A9CA8"/><rect x="40" y="37" width="30" height="3" rx="1.5" fill="#B9BBC4"/><rect x="40" y="43" width="26" height="3" rx="1.5" fill="#B9BBC4"/>
      <g fill="#8E909C">${[[52,56],[59,56],[59,63],[52,63]].map(([x,y])=>`<rect x="${x}" y="${y}" width="5" height="5" rx="1"/>`).join("")}</g>
      <circle cx="80" cy="74" r="14" fill="url(#${s})"/><circle cx="80" cy="74" r="13.5" fill="none" stroke="#fff" stroke-opacity=".45"/>
      <path d="M74 74.2l4 4 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`); },
  () => { const [c, dc] = lg("#A9A7FF", "#5652D6"), [f, df] = glassShadow(), [ch, dch] = lg("#F4E3B5", "#C9A75E");
    return svg(`<defs>${dc}${df}${dch}</defs><ellipse cx="60" cy="86" rx="38" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>
      <g transform="rotate(-8 60 52)"><rect x="18" y="26" width="84" height="54" rx="10" fill="url(#${c})"/>
      <rect x="18" y="26" width="84" height="27" rx="10" fill="#fff" opacity=".14"/><rect x="18.5" y="26.5" width="83" height="53" rx="9.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
      <circle cx="36" cy="46" r="8" fill="#fff" opacity=".9"/><rect x="50" y="40" width="34" height="4" rx="2" fill="#fff" opacity=".9"/><rect x="50" y="48" width="22" height="4" rx="2" fill="#fff" opacity=".55"/>
      <rect x="28" y="62" width="14" height="10" rx="2.5" fill="url(#${ch})"/><circle cx="90" cy="68" r="5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".8"/></g>`); },
  () => { const [a, da] = lg("#F1D0B4", "#B98762"), [b, db] = lg("#C6D0EA", "#7684A8"), [c, dc] = lg("#E2C4F0", "#9B72B3"), [f, df] = glassShadow(), [r, dr] = lg("#FF9BA9", "#E0566C");
    const p = (cx, cy, rr, g) => `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="url(#${g})"/><ellipse cx="${cx - rr * .3}" cy="${cy - rr * .45}" rx="${rr * .45}" ry="${rr * .28}" fill="#fff" opacity=".35"/>`;
    return svg(`<defs>${da}${db}${dc}${df}${dr}</defs><ellipse cx="60" cy="86" rx="36" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>
      ${p(38, 52, 16, b)}${p(82, 52, 16, c)}${p(60, 48, 21, a)}
      <circle cx="84" cy="70" r="11" fill="url(#${r})"/><rect x="78.5" y="66" width="11" height="8" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M78.5 66.5l5.5 4 5.5-4" fill="none" stroke="#fff" stroke-width="1.6"/>`); },
  () => { const cols = [["#F3C68A","#C98A3E"],["#AFADFF","#6764DE"],["#7FE0CF","#3B9F8E"],["#E9B4F7","#A469C2"],["#8FC4FF","#3E86E0"]], [f, df] = glassShadow(); let defs = df, body = "";
    const xs = [22, 36, 50, 66, 80], hs = [50, 56, 46, 54, 50];
    cols.forEach(([c1, c2], i) => { const [g, d] = lg(c1, c2); defs += d; const x = xs[i], h = hs[i], y = 80 - h, w = i === 4 ? 12 : 12;
      body += i === 4 ? `<g transform="rotate(14 ${x + 6} 80)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#${g})"/>${hl(x, y, w, h, 4)}</g>` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#${g})"/>${hl(x, y, w, h, 4)}<rect x="${x + 3}" y="${y + 8}" width="6" height="2" rx="1" fill="#fff" opacity=".7"/>`; });
    return svg(`<defs>${defs}</defs><ellipse cx="60" cy="86" rx="38" ry="5" fill="#000" opacity=".45" filter="url(#${f})"/>${body}<rect x="16" y="80" width="88" height="4" rx="2" fill="#fff" opacity=".22"/>`); },
];

/* ---------------- B. Точки ---------------- */
function dots(color, step = 4, r = 1.25) { const p = id("p"); return [p, `<pattern id="${p}" width="${step}" height="${step}" patternUnits="userSpaceOnUse"><circle cx="${step / 2}" cy="${step / 2}" r="${r}" fill="${color}"/></pattern>`]; }
const dotted = [
  () => { const [a, da] = dots("var(--violet)"), [b, db] = dots("var(--teal)"), [c, dc] = dots("var(--amber)");
    return svg(`<defs>${da}${db}${dc}</defs><g transform="rotate(-13 44 58)"><rect x="24" y="24" width="42" height="56" rx="9" fill="url(#${b})"/></g>
      <g transform="rotate(10 78 58)"><rect x="56" y="22" width="42" height="56" rx="9" fill="url(#${c})"/></g>
      <rect x="38" y="16" width="44" height="62" rx="9" fill="var(--face)"/><rect x="38" y="16" width="44" height="62" rx="9" fill="url(#${a})"/>
      <rect x="38.5" y="16.5" width="43" height="61" rx="8.5" fill="none" stroke="var(--violet)" stroke-opacity=".6"/>`); },
  () => { const [g, dg] = dots("var(--green)", 4, 1.4), [w, dw] = dots("rgba(255,255,255,.45)", 4, 1.1);
    return svg(`<defs>${dg}${dw}</defs>${[[24,58,22],[38,48,32],[52,40,40],[66,30,50]].map(([x,y,h],i)=>`<rect x="${x}" y="${y}" width="11" height="${h}" rx="2" fill="url(#${i === 3 ? g : w})"/>`).join("")}
      <rect x="80" y="18" width="11" height="62" rx="2" fill="url(#${g})"/><path d="M22 82h76" stroke="rgba(255,255,255,.25)" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>`); },
  () => { const [w, dw] = dots("rgba(255,255,255,.5)", 3.6, 1.1), [s, ds] = dots("var(--sky)", 3.6, 1.3);
    return svg(`<defs>${dw}${ds}</defs><rect x="32" y="16" width="48" height="66" rx="8" fill="url(#${w})"/>
      <rect x="40" y="26" width="26" height="5" rx="2.5" fill="var(--face)"/><rect x="40" y="35" width="32" height="4" rx="2" fill="var(--face)"/><rect x="40" y="42" width="28" height="4" rx="2" fill="var(--face)"/>
      <circle cx="80" cy="72" r="16" fill="var(--face)"/><circle cx="80" cy="72" r="14" fill="url(#${s})"/>
      <path d="M73.5 72.2l4.4 4.4 8-8.2" fill="none" stroke="var(--text)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`); },
  () => { const [c, dc] = dots("var(--accent)", 3.6, 1.3);
    return svg(`<defs>${dc}</defs><g transform="rotate(-8 60 52)"><rect x="18" y="26" width="84" height="54" rx="10" fill="url(#${c})"/>
      <rect x="18.5" y="26.5" width="83" height="53" rx="9.5" fill="none" stroke="var(--accent)" stroke-opacity=".7"/>
      <circle cx="37" cy="47" r="9" fill="var(--text)"/><rect x="52" y="40" width="34" height="5" rx="2.5" fill="var(--text)"/><rect x="52" y="49" width="22" height="5" rx="2.5" fill="var(--text)" opacity=".6"/>
      <rect x="28" y="62" width="14" height="10" rx="2.5" fill="var(--text)" opacity=".85"/></g>`); },
  () => { const [a, da] = dots("var(--amber)", 3.4, 1.2), [b, db] = dots("var(--sky)", 3.4, 1.2), [c, dc] = dots("var(--lilac)", 3.4, 1.2);
    const person = (cx, p, s = 1) => `<circle cx="${cx}" cy="${44 - (s - 1) * 8}" r="${11 * s}" fill="url(#${p})"/><path d="M${cx - 17 * s} 84a${17 * s} ${17 * s} 0 0 1 ${34 * s} 0z" fill="url(#${p})"/>`;
    return svg(`<defs>${da}${db}${dc}</defs>${person(34, b, .85)}${person(86, c, .85)}${person(60, a, 1.08)}`); },
  () => { const ps = ["var(--amber)", "var(--violet)", "var(--teal)", "var(--lilac)", "var(--sky)"].map((c) => dots(c, 3.4, 1.2));
    const xs = [22, 36, 50, 66, 80], hs = [50, 58, 46, 54, 50];
    return svg(`<defs>${ps.map((p) => p[1]).join("")}</defs>${ps.map(([p], i) => { const x = xs[i], h = hs[i], y = 80 - h;
      return i === 4 ? `<rect x="${x}" y="${y}" width="12" height="${h}" rx="3" fill="url(#${p})" transform="rotate(14 ${x + 6} 80)"/>` : `<rect x="${x}" y="${y}" width="12" height="${h}" rx="3" fill="url(#${p})"/>`; }).join("")}
      <path d="M16 83h88" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>`); },
];

/* ---------------- C. Линия ---------------- */
const S = `fill="none" stroke="var(--text)" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"`;
const line = [
  () => svg(`<g ${S}><rect x="30" y="22" width="40" height="56" rx="7" transform="rotate(-10 50 50)" stroke-opacity=".45"/><rect x="46" y="20" width="42" height="58" rx="7" fill="var(--face)"/><path d="M54 34h20M54 42h13"/></g>
    <rect x="54" y="58" width="26" height="10" rx="5" fill="var(--violet)"/>`),
  () => svg(`<g ${S}><path d="M22 80h76"/><path d="M32 80V62M46 80V52M60 80V58"/></g><path d="M74 80V36" stroke="var(--green)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="26" r="11" fill="var(--green)"/><text x="92" y="30.5" text-anchor="middle" font-family="Onest" font-weight="600" font-size="12.5" fill="#131315">8</text>`),
  () => svg(`<g ${S}><path d="M36 18h30l14 14v48a4 4 0 0 1-4 4H36a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z"/><path d="M66 18v14h14M42 44h22M42 52h16"/></g>
    <circle cx="80" cy="74" r="12" fill="var(--sky)"/><path d="M74.5 74l3.7 3.7 6.6-6.8" fill="none" stroke="#131315" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`),
  () => svg(`<g ${S}><rect x="18" y="26" width="84" height="54" rx="10"/><circle cx="38" cy="48" r="8"/><path d="M54 44h30M54 53h18M30 70h60" stroke-opacity=".55"/></g>
    <rect x="76" y="62" width="16" height="10" rx="3" fill="var(--accent)"/>`),
  () => svg(`<g ${S}><circle cx="46" cy="40" r="11"/><path d="M26 82c0-12 9-21 20-21s20 9 20 21"/><circle cx="76" cy="44" r="9" stroke-opacity=".5"/><path d="M70 64c3-2 4-3 7-3 10 0 17 8 17 18" stroke-opacity=".5"/></g>
    <circle cx="88" cy="28" r="9" fill="var(--rose)"/><path d="M84 26.5h8M84 30h5" stroke="#131315" stroke-width="1.8" stroke-linecap="round"/>`),
  () => svg(`<g ${S}><path d="M18 82h84"/><rect x="24" y="30" width="12" height="52" rx="2.5"/><rect x="40" y="24" width="12" height="58" rx="2.5"/><rect x="56" y="34" width="12" height="48" rx="2.5"/><rect x="78" y="30" width="12" height="52" rx="2.5" transform="rotate(14 84 82)"/></g>
    <rect x="41.2" y="36" width="9.6" height="7" fill="var(--amber)"/>`),
];

/* ---------------- D. Орбиты (фирменный мотив) ---------------- */
const ORB = (cx, cy, rx, ry, rot, color, t = 0.18) => { const a = Math.PI * 2 * t; const r = rot * Math.PI / 180;
  const px = cx + rx * Math.cos(a) * Math.cos(r) - ry * Math.sin(a) * Math.sin(r), py = cy + rx * Math.cos(a) * Math.sin(r) + ry * Math.sin(a) * Math.cos(r);
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="1.4"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${color}"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="8" fill="${color}" opacity=".18"/>`; };
const M = "#E7E7EA", M2 = "#A9A9B1", M3 = "#5E5E66";
const orbit = [
  () => svg(`${ORB(60, 52, 50, 16, -14, "var(--violet)", .1)}<rect x="44" y="26" width="32" height="44" rx="6" fill="${M3}" transform="rotate(-10 60 48)"/><rect x="46" y="22" width="32" height="46" rx="6" fill="${M}"/><rect x="52" y="31" width="18" height="3.5" rx="1.75" fill="${M2}"/><rect x="52" y="38" width="12" height="3.5" rx="1.75" fill="${M2}"/>`),
  () => svg(`${ORB(60, 54, 50, 15, -10, "var(--green)", .62)}<rect x="40" y="52" width="9" height="20" rx="3" fill="${M3}"/><rect x="53" y="42" width="9" height="30" rx="3" fill="${M2}"/><rect x="66" y="30" width="9" height="42" rx="3" fill="${M}"/>`),
  () => svg(`${ORB(60, 52, 48, 17, 12, "var(--sky)", .15)}<path d="M46 20h22l10 10v40a4 4 0 0 1-4 4H46a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="${M}"/><path d="M68 20v10h10" fill="${M2}"/><rect x="48" y="40" width="22" height="3.5" rx="1.75" fill="${M2}"/><rect x="48" y="47" width="16" height="3.5" rx="1.75" fill="${M2}"/>`),
  () => svg(`${ORB(60, 52, 52, 18, -16, "var(--accent)", .58)}<rect x="30" y="32" width="60" height="38" rx="8" fill="${M}"/><circle cx="44" cy="48" r="6" fill="${M2}"/><rect x="55" y="44" width="24" height="3.5" rx="1.75" fill="${M2}"/><rect x="55" y="51" width="15" height="3.5" rx="1.75" fill="${M2}"/><rect x="38" y="59" width="9" height="6" rx="1.8" fill="${M3}"/>`),
  () => svg(`${ORB(60, 54, 50, 16, 10, "var(--rose)", .12)}<circle cx="47" cy="44" r="9" fill="${M2}"/><path d="M33 74a14 14 0 0 1 28 0z" fill="${M2}"/><circle cx="66" cy="40" r="11" fill="${M}"/><path d="M49 74a17 17 0 0 1 34 0z" fill="${M}"/>`),
  () => svg(`${ORB(60, 56, 50, 15, -8, "var(--amber)", .6)}<rect x="38" y="30" width="10" height="42" rx="3" fill="${M}"/><rect x="51" y="24" width="10" height="48" rx="3" fill="${M2}"/><rect x="64" y="32" width="10" height="40" rx="3" fill="${M}"/><rect x="77" y="34" width="10" height="38" rx="3" fill="${M3}" transform="rotate(14 82 72)"/>`),
];

/* ---------------- E. Клей (мягкое 3D) ---------------- */
function rg(c1, c2) { const g = id("r"); return [g, `<radialGradient id="${g}" cx=".32" cy=".25" r=".9"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>`]; }
function soft() { const f = id("s"); return [f, `<filter id="${f}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/><feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/><feOffset dx="-1.5" dy="-2.5"/><feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="ish"/><feFlood flood-color="#000" flood-opacity=".22"/><feComposite in2="ish" operator="in"/><feComposite in2="SourceGraphic" operator="over"/></filter>`]; }
const clay = [
  () => { const [a, da] = rg("#C7C5FF", "#6C69E6"), [b, db] = rg("#9AEEDF", "#36A08E"), [c, dc] = rg("#FFD9A0", "#CF8B3A"), [f, df] = soft();

      <rect x="47" y="30" width="22" height="5" rx="2.5" fill="#fff" opacity=".9"/><rect x="47" y="39" width="14" height="5" rx="2.5" fill="#fff" opacity=".6"/>`); },

      <g transform="rotate(-8 60 52)"><circle cx="37" cy="47" r="8" fill="#fff" opacity=".92"/><rect x="51" y="41" width="32" height="5" rx="2.5" fill="#fff" opacity=".92"/><rect x="51" y="50" width="20" height="5" rx="2.5" fill="#fff" opacity=".6"/><rect x="28" y="62" width="14" height="10" rx="4" fill="#F4D58E"/></g>`); },
  () => { const [a, da] = rg("#FFE0C4", "#C38C64"), [b, db] = rg("#D9E2FA", "#7684A8"), [c, dc] = rg("#F0D6FF", "#9C70B6"), [f, df] = soft();
    const head = (cx, cy, r, g) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${g})"/>`;

/* ---------------- общие цвета (hex — чтобы считать оттенки) ---------------- */
const HEX = { violet: "#8F8DF7", green: "#4FCB85", sky: "#6AA9F2", accent: "#8B8EFF", rose: "#E58091", amber: "#E0A75E", teal: "#52BBAA", lilac: "#C69CF0" };
const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };

/* ---------------- F. Цветные плитки: тонированная плитка + белый сплошной глиф ---------------- */
const W = "#fff";
const tinted = [
  () => svg(`<rect x="30" y="24" width="40" height="54" rx="9" fill="${W}" opacity=".45" transform="rotate(-12 50 51)"/><rect x="46" y="20" width="42" height="58" rx="9" fill="${W}"/>
    <rect x="54" y="32" width="24" height="5" rx="2.5" fill="var(--c)"/><rect x="54" y="41" width="16" height="5" rx="2.5" fill="var(--c)" opacity=".55"/>`),
  () => svg(`${[[26,56,24],[42,46,34],[58,38,42]].map(([x,y,h])=>`<rect x="${x}" y="${y}" width="12" height="${h}" rx="4" fill="${W}" opacity=".5"/>`).join("")}<rect x="74" y="24" width="12" height="56" rx="4" fill="${W}"/>`),
  () => svg(`<path d="M38 16h28l16 16v46a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z" fill="${W}"/><path d="M66 16v12a4 4 0 0 0 4 4h12" fill="${W}" opacity=".55"/>
    <rect x="41" y="40" width="22" height="5" rx="2.5" fill="var(--c)" opacity=".55"/><rect x="41" y="49" width="30" height="5" rx="2.5" fill="var(--c)" opacity=".55"/>
    <circle cx="82" cy="74" r="14" fill="var(--c)"/><circle cx="82" cy="74" r="11" fill="${W}"/><path d="M76.5 74.2l3.8 3.8 7-7.2" fill="none" stroke="var(--c)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`),
  () => svg(`<rect x="16" y="24" width="88" height="56" rx="11" fill="${W}"/><circle cx="36" cy="46" r="9" fill="var(--c)"/><rect x="52" y="39" width="36" height="5" rx="2.5" fill="var(--c)"/><rect x="52" y="48" width="22" height="5" rx="2.5" fill="var(--c)" opacity=".5"/><rect x="28" y="62" width="16" height="10" rx="3" fill="var(--c)" opacity=".7"/>`),
  () => svg(`<circle cx="76" cy="40" r="11" fill="${W}" opacity=".5"/><path d="M60 82a18 18 0 0 1 34 0z" fill="${W}" opacity=".5"/><circle cx="50" cy="38" r="14" fill="${W}"/><path d="M26 84a24 24 0 0 1 48 0z" fill="${W}"/>`),
  () => svg(`${[[20,28,.6],[35,22,1],[50,32,.6]].map(([x,y,o])=>`<rect x="${x}" y="${y}" width="12" height="${80 - y}" rx="3" fill="${W}" opacity="${o}"/>`).join("")}<rect x="72" y="28" width="12" height="52" rx="3" fill="${W}" opacity=".85" transform="rotate(14 78 80)"/><rect x="16" y="80" width="88" height="5" rx="2.5" fill="${W}" opacity=".4"/>`),
];
const TINT = ["violet", "green", "sky", "accent", "rose", "amber"].map((c) => ({
  face: `linear-gradient(160deg, ${mix(HEX[c], "#1B1B1E", .35)}, ${mix(HEX[c], "#1B1B1E", .62)})`, c: mix(HEX[c], "#1B1B1E", .45),
}));

/* ---------------- G. Изометрия ---------------- */
const O = [60, 58], K = .866;
const P = (x, y, z) => [O[0] + (x - y) * K, O[1] + (x + y) * .5 - z];
const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="${fill}"/>`;
function box(x, y, z, w, d, h, c) {
  const top = mix(c, "#ffffff", .22), left = c, right = mix(c, "#000000", .32);
  return poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], left)
    + poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], right)
    + poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], top);
}
const shadowIso = (x, y, w, d) => poly([P(x - 2, y - 2, 0), P(x + w + 4, y - 2, 0), P(x + w + 4, y + d + 4, 0), P(x - 2, y + d + 4, 0)], "rgba(0,0,0,.35)");
const iso = [
  () => svg(`${shadowIso(-20, -14, 40, 28)}${box(-20, -14, 0, 40, 28, 7, HEX.teal)}${box(-17, -12, 7, 38, 26, 7, HEX.amber)}${box(-21, -15, 14, 40, 28, 7, HEX.violet)}`),
  () => svg(`${shadowIso(-30, -8, 62, 14)}${[[-30, 10, "#55555E"], [-14, 18, "#6A6A74"], [2, 26, "#80808A"], [18, 36, HEX.green]].map(([x, h, c]) => box(x, -8, 0, 11, 11, h, c)).join("")}`),
  () => svg(`${shadowIso(-18, -26, 36, 50)}${box(-18, -26, 0, 36, 50, 2.5, "#D9DAE2")}${box(-14, -22, 2.5, 18, 3, .6, "#9A9CA8")}${box(-14, -14, 2.5, 24, 3, .6, "#B5B7C1")}${box(-14, -8, 2.5, 20, 3, .6, "#B5B7C1")}${box(6, 10, 2.5, 10, 10, 5, HEX.sky)}`),
  () => svg(`${shadowIso(-28, -18, 56, 36)}${box(-28, -18, 0, 56, 36, 3, HEX.accent)}${box(-22, 4, 3, 11, 8, 1.6, "#E6C77A")}${box(-6, -12, 3, 26, 4, .6, "#FFFFFF")}${box(-6, -4, 3, 16, 4, .6, "#DADAFF")}`),
  () => { const head = (x, y, z, r, c) => { const [cx, cy] = P(x, y, z); return `<circle cx="${cx.toFixed(1)}" cy="${(cy - r).toFixed(1)}" r="${r}" fill="${c}"/><circle cx="${(cx - r * .35).toFixed(1)}" cy="${(cy - r * 1.35).toFixed(1)}" r="${r * .35}" fill="#fff" opacity=".35"/>`; };
    return svg(`${shadowIso(-28, -10, 56, 18)}${box(-28, -8, 0, 16, 16, 14, mix(HEX.sky, "#000000", .1))}${head(-20, 0, 14, 9, "#C6D0EA")}${box(4, -12, 0, 18, 18, 22, HEX.rose)}${head(13, -3, 22, 11, "#F1D0B4")}`); },
  () => svg(`${shadowIso(-26, -10, 52, 22)}${[[HEX.amber, 34], [HEX.violet, 40], [HEX.teal, 30], [HEX.lilac, 36], [HEX.sky, 32]].map(([c, h], i) => box(-26 + i * 10, -10, 0, 8, 20, h, c)).join("")}`),
];

    <circle cx="94" cy="24" r="13" fill="${MUTE("green")}"/></g><text x="94" y="29" text-anchor="middle" font-family="Onest" font-weight="600" font-size="14" fill="#fff">8</text>`); },
  () => { const [f, d] = cut(); return svg(`<defs>${d}</defs><circle cx="60" cy="50" r="40" fill="${MUTE("sky")}" opacity=".18"/><g filter="url(#${f})">

    <path d="M80 60l5 4 6-1 1 6 4 5-4 5-1 6-6-1-5 4-5-4-6 1-1-6-4-5 4-5 1-6 6 1z" fill="${MUTE("sky")}"/></g><path d="M75 74.5l3.6 3.6 6.6-6.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`); },
  () => { const [f, d] = cut(); return svg(`<defs>${d}</defs><circle cx="60" cy="50" r="40" fill="${MUTE("accent")}" opacity=".18"/><g filter="url(#${f})" transform="rotate(-6 60 52)">
    <rect x="18" y="26" width="84" height="54" rx="8" fill="${MUTE("accent")}"/><rect x="18" y="62" width="84" height="18" rx="0" fill="#000" opacity=".12"/><circle cx="37" cy="45" r="8" fill="#F2F2F4"/>
    <rect x="51" y="39" width="34" height="5" rx="2.5" fill="#F2F2F4"/><rect x="51" y="48" width="22" height="5" rx="2.5" fill="#F2F2F4" opacity=".7"/><rect x="28" y="65" width="14" height="10" rx="2" fill="#D9BE7E"/></g>`); },
  () => { const [f, d] = cut(); return svg(`<defs>${d}</defs><circle cx="60" cy="50" r="40" fill="${MUTE("rose")}" opacity=".18"/><g filter="url(#${f})">
    <circle cx="80" cy="40" r="10" fill="${MUTE("sky")}"/><path d="M64 80a16 16 0 0 1 32 0z" fill="${MUTE("sky")}"/><circle cx="50" cy="38" r="13" fill="${MUTE("rose")}"/><path d="M28 82a22 22 0 0 1 44 0z" fill="${MUTE("rose")}"/></g>`); },
  () => { const [f, d] = cut(); return svg(`<defs>${d}</defs><circle cx="60" cy="50" r="40" fill="${MUTE("amber")}" opacity=".18"/><g filter="url(#${f})">
    ${[["amber",30,22],["violet",22,36],["teal",34,50],["lilac",26,64]].map(([c,y,x])=>`<rect x="${x}" y="${y}" width="12" height="${80 - y}" rx="2" fill="${MUTE(c)}"/>`).join("")}<rect x="80" y="30" width="12" height="50" rx="2" fill="${MUTE("sky")}" transform="rotate(14 86 80)"/><rect x="16" y="80" width="88" height="5" rx="1.5" fill="#55555D"/></g>`); },
];

const STYLES = [
  ["A", "Стекло", "глянец, градиенты, блик — как иконки Apple", glass],
  ["B", "Точки", "предметы из точечного растра — фирменный мотив", dotted],
  ["C", "Линия", "тонкий монолайн и одна цветная деталь", line],
  ["D", "Орбиты", "светлые предметы на орбите с цветной планетой", orbit],
  ["E", "Клей", "мягкое 3D, объём и тень", clay],
  ["F", "Цветные плитки", "плитка в цвете раздела, белый сплошной глиф — как в «Настройках» iPhone", tinted, TINT],

  <div class="grid">${set.map((f, i) => `<div class="tile"><span class="face"${faces ? ` style="background:${faces[i].face};--c:${faces[i].c}"` : ""}>${f()}</span>${LABELS[i]}</div>`).join("")}</div></section>`).join("");
</script>
