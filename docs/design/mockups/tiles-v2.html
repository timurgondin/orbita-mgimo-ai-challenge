<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Орбита — плитки «Сегодня»: разные сюжеты (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#131315; --s1:#1B1B1E; --s2:#212124; --text:#EDEDEF; --text-3:#7E7E87; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Onest",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .page{max-width:1180px;margin:0 auto;padding:44px 40px 80px}
  h1{font-size:34px;font-weight:500;letter-spacing:-.03em}
  section{margin-top:52px}
  h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:14px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
  .face{--face:var(--s1);display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:24px;background:var(--face);transition:background .2s}
  .face svg{width:66%;height:auto;transition:transform .45s cubic-bezier(.34,1.35,.5,1)}
  .tile:hover .face{--face:var(--s2)}
  .tile:hover .face svg{transform:translateY(-2px) scale(1.06)}
  .cap{font-size:13.5px;color:var(--text-3);text-align:center}
  @media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:640px){.page{padding:24px 16px 60px}.grid{gap:12px}}
</style>
</head>

  <h1>Плитки «Сегодня» — сюжеты</h1>

const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const [x, y] = [p(a), p(b)]; return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
let n = 0;
function S(body) { // собирает svg, превращая fill="G:color" в градиент
  let defs = "";
  body = body.replace(/G:(#[0-9a-fA-F]{6})/g, (_, c) => { const id = "g" + ++n; defs += `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(c, "#ffffff", .22)}"/><stop offset="1" stop-color="${mix(c, "#000000", .18)}"/></linearGradient>`; return `url(#${id})`; });
  const sh = "s" + ++n;
  defs += `<filter id="${sh}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`;
  return `<svg viewBox="0 0 120 100" aria-hidden="true"><defs>${defs}</defs><ellipse cx="60" cy="89" rx="34" ry="4.5" fill="#000" opacity=".45" filter="url(#${sh})"/>${body}</svg>`;
}
