<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Орбита — плитки «Сегодня»: направления (v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131315; --s1:#1B1B1E; --s2:#212124; --s3:#2A2A2E; --text:#EDEDEF; --text-2:#9A9AA2; --text-3:#7E7E87;
    --accent:#8B8EFF; --urgent:#F2A35E; --green:#5BD891;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.35,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Onest",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .page{max-width:1180px;margin:0 auto;padding:44px 40px 90px}
  h1{font-size:34px;font-weight:500;letter-spacing:-.03em}
  section{margin-top:60px}
  h2{font-size:18px;font-weight:600;letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline}
  h2 small{font-size:14px;font-weight:400;color:var(--text-3)}
  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:16px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px;font-weight:500;letter-spacing:-.01em;cursor:pointer;user-select:none}
  .face{position:relative;width:100%;aspect-ratio:1;border-radius:24px;background:var(--s1);overflow:hidden;transition:background .25s var(--ease),transform .2s var(--ease)}
  .tile:hover .face{background:var(--s2)}
  .tile:active .face{transform:scale(.97)}
  @media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:640px){.page{padding:24px 16px 60px}.grid{gap:12px}}

  /* ---------- A. Живые виджеты ---------- */
  .w{display:flex;flex-direction:column;padding:16px 16px 15px;text-align:left}
  .w .hd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2)}
  .w .hd svg{width:15px;height:15px;flex-shrink:0}
  .w .big{margin-top:auto;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1}
  .w .big small{font-size:14px;font-weight:500;color:var(--text-3);letter-spacing:0;margin-left:3px}
  .w .sub{margin-top:5px;font-size:12.5px;color:var(--text-3);line-height:1.3}
  .w .t{margin-top:auto;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
  .w.wide-label + .lbl{display:none}
  .seg{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .seg i{display:block;height:4px;border-radius:3px;background:var(--s3);position:relative;overflow:hidden}
  .seg i b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c);width:var(--p);transition:width .8s var(--ease)}
  .tile:hover .seg i b{width:calc(var(--p) + 4%)}
  .spark{margin-top:8px;width:100%;height:34px;overflow:visible}
  .spark path.l{stroke-dasharray:160;stroke-dashoffset:0;transition:stroke-dashoffset .9s var(--ease)}
  .tile:hover .spark path.l{animation:draw 1s var(--ease)}
  @keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
  .qr{margin-top:auto;align-self:flex-start;padding:6px;border-radius:12px;background:#fff;line-height:0;transition:transform .45s var(--spring)}
  .tile:hover .qr{transform:scale(1.05) rotate(-2deg)}
  .avs{display:flex;margin-top:auto}
  .avs span{width:30px;height:30px;border-radius:50%;margin-left:-8px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;box-shadow:0 0 0 2.5px var(--s1),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .35s var(--spring),box-shadow .25s}
  .avs span:first-child{margin-left:0}
  .tile:hover .avs span{box-shadow:0 0 0 2.5px var(--s2),inset 0 1px 0 rgba(255,255,255,.3)}
  .tile:hover .avs span:nth-child(2){transform:translateX(3px)}
  .tile:hover .avs span:nth-child(3){transform:translateX(6px)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
  .bar{margin-top:9px;height:4px;border-radius:3px;background:var(--s3);overflow:hidden}
  .bar b{display:block;height:100%;width:88%;border-radius:3px;background:var(--urgent)}

  /* ---------- B. Точечная матрица ---------- */
  .m svg{position:absolute;inset:0;width:100%;height:100%}
  .m .off{fill:#fff;opacity:.055}
  .m .on{fill:#fff;opacity:.92;transform-box:fill-box;transform-origin:center}
  .m .ac{opacity:1}
  .tile:hover .m .on{animation:ripple .7s var(--ease) both;animation-delay:calc(var(--d) * 22ms)}
  @keyframes ripple{0%{opacity:.92;transform:scale(1)}40%{opacity:1;transform:scale(1.45)}100%{opacity:.92;transform:scale(1)}}

  /* ---------- C. Жидкое стекло ---------- */
  .g svg{position:absolute;inset:0;width:100%;height:100%}
  .g .plate{transition:transform .5s var(--spring);transform-origin:60px 50px}
  .g .light{transition:transform .7s var(--ease),opacity .4s}
  .tile:hover .g .plate{transform:translateY(-3px) scale(1.035)}
  .tile:hover .g .light{transform:translate(2px,4px) scale(1.08);opacity:1}
</style>
</head>
<body>
<main class="page">
  <h1>Плитки «Сегодня» — направления</h1>
  <div id="root"></div>
</main>

<script>
const LABELS = ["Мои курсы", "Оценки", "Справки", "Студбилет", "Преподаватели", "Библиотека"];
const COLORS = { violet: "#8F8DF7", teal: "#52BBAA", amber: "#E0A75E", rose: "#E58091", sky: "#6AA9F2", green: "#4FCB85", lilac: "#C69CF0", accent: "#8B8EFF" };
let uid = 0; const id = (p) => `${p}${++uid}`;

/* Мини-глифы (24×24, линия 1.8) — для шапки виджетов */
const G = {
  courses: `<path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H18v15H6.5A1.5 1.5 0 0 0 5 20.5zM5 20.5A1.5 1.5 0 0 0 6.5 22H18v-3"/>`,
  grades: `<path d="M5 20V13M12 20V8M19 20V4"/>`,
  docs: `<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/>`,
  card: `<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M13 10h5M13 14h3M6 15.5h5"/>`,
  people: `<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 4.8a3.2 3.2 0 0 1 0 6.4M20.5 20a5.5 5.5 0 0 0-3.5-5.1"/>`,
  books: `<path d="M5 4v16M9 4v16M13 6l4.5 14"/>`,
};
const glyph = (k, color) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${G[k]}</svg>`;

/* ================= A. Живые виджеты ================= */
function qr(size) {
  const N = 21, s = size / N; let r = ""; let seed = 250412; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const fin = (x, y) => `<rect x="${x * s}" y="${y * s}" width="${7 * s}" height="${7 * s}" rx="${1.6 * s}" fill="#1b1b1d"/><rect x="${(x + 1) * s}" y="${(y + 1) * s}" width="${5 * s}" height="${5 * s}" rx="${1.1 * s}" fill="#fff"/><rect x="${(x + 2) * s}" y="${(y + 2) * s}" width="${3 * s}" height="${3 * s}" rx="${.8 * s}" fill="#1b1b1d"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if ((x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9)) continue; if (rnd() > .55) r += `<circle cx="${(x + .5) * s}" cy="${(y + .5) * s}" r="${s * .42}" fill="#1b1b1d"/>`; }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${r}${fin(0, 0)}${fin(N - 7, 0)}${fin(0, N - 7)}</svg>`;
}
const widgets = [
  () => `<div class="face w"><div class="hd">${glyph("courses", "#8F8DF7")}6 курсов</div>
    <div class="t" style="margin-top:auto">Микроэкономика<div class="sub" style="margin-top:3px">Сейчас, ауд. 3108</div></div>
    <div class="seg">${[["#E0A75E",81],["#8F8DF7",74],["#E58091",86],["#52BBAA",90]].map(([c,p])=>`<i style="--c:${c};--p:${p}%"><b></b></i>`).join("")}</div></div>`,
  () => `<div class="face w"><div class="hd">${glyph("grades", "#5BD891")}Средний балл</div>
    <div class="big">8,1<small>из 10</small></div>
    <svg class="spark" viewBox="0 0 120 34" preserveAspectRatio="none"><defs><linearGradient id="sp" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5BD891" stop-opacity=".28"/><stop offset="1" stop-color="#5BD891" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 26 C14 24 20 18 32 20 S52 28 62 18 S84 10 94 12 S112 4 120 3 V34 H0Z" fill="url(#sp)"/>
      <path class="l" d="M0 26 C14 24 20 18 32 20 S52 28 62 18 S84 10 94 12 S112 4 120 3" fill="none" stroke="#5BD891" stroke-width="2.2" stroke-linecap="round"/><circle cx="120" cy="3" r="3" fill="#5BD891"/></svg></div>`,
  () => `<div class="face w"><div class="hd">${glyph("docs", "#B39BFB")}Справки</div>
    <div class="t">Справка<br>об обучении</div><div class="sub" style="color:var(--green)"><span class="dot"></span>Готова</div>
    <div class="sub">Для визы — в работе</div></div>`,
  () => `<div class="face w"><div class="hd">${glyph("card", "#8B8EFF")}№ 250412</div><span class="qr">${qr(66)}</span></div>`,
  () => `<div class="face w"><div class="hd">${glyph("people", "#E58091")}Консультация</div>
    <div class="t" style="margin-top:14px">Сегодня в 16:20</div><div class="sub">Соколов Д. В., каб. 518</div>
    <div class="avs">${[["ДС","#9FAAC8,#56627F"],["ЕП","#D8A889,#8F5F48"],["KM","#B79BCC,#6E5287"]].map(([t,g])=>`<span style="background:linear-gradient(160deg,${g})">${t}</span>`).join("")}</div></div>`,
  () => `<div class="face w"><div class="hd">${glyph("books", "#F2A35E")}Библиотека</div>
    <div class="t">«Экономикс»</div><div class="sub" style="color:var(--urgent)">Вернуть до завтра</div><div class="bar"><b></b></div></div>`,
];

/* ================= B. Точечная матрица (как Nothing OS) ================= */
// '#' — точка горит, 'o' — точка акцента, '.' — погашена. Сетка 17×13 в плитке, знак по центру.
const MAT = [
  ["#8F8DF7", [
    "#####.ooooo",
    "#####.ooooo",
    "#####.ooooo",
    "...........",
    "#####.#####",
    "#####.#####",
    "#####.#####"]],
  ["#5BD891", [
    "..........oo",
    "..........oo",
    ".......##.oo",
    ".......##.oo",
    "....##.##.oo",
    "....##.##.oo",
    ".##.##.##.oo",
    ".##.##.##.oo"]],
  ["#B39BFB", [
    "#######....",
    "#.....##...",
    "#.....#.#..",
    "#.....####.",
    "#........#.",
    "#.#####..#.",
    "#........#.",
    "#.###..ooo.",
    "#.....ooooo",
    "#.....ooooo",
    "######.ooo."]],
  ["#8B8EFF", [
    "#############",
    "#...........#",
    "#.##..#####.#",
    "#.##........#",
    "#.##..###...#",
    "#...........#",
    "#.oo........#",
    "#############"]],
  ["#E58091", [
    "..###...ooo.",
    ".#####.ooooo",
    ".#####.ooooo",
    "..###...ooo.",
    "............",
    "#######.oooo",
    "#######.oooo"]],
  ["#F2A35E", [
    "##.##.##..oo",
    "##.##.##..oo",
    "##.##.##.oo.",
    "##.##.##.oo.",
    "##.##.##oo..",
    "##.##.##oo..",
    "############"]],
];
function matrix([accent, rows], k) {
  const COLS = 17, ROWS = 13, sp = 120 / (COLS + 1), r = sp * .3;
  const ox = Math.floor((COLS - rows[0].length) / 2), oy = Math.floor((ROWS - rows.length) / 2);
  let off = "", on = "";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const ch = rows[y - oy]?.[x - ox] ?? ".";
    const cx = (x + 1) * sp, cy = (y + 1) * sp + (120 - (ROWS + 1) * sp) / 2;
    if (ch === ".") off += `<circle class="off" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(2)}"/>`;
    else on += `<circle class="on${ch === "o" ? " ac" : ""}" style="--d:${x + y}${ch === "o" ? `;fill:${accent}` : ""}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 1.12).toFixed(2)}"/>`;
  }
  return `<div class="face m"><svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet">${off}${on}</svg></div>`;
}

/* ================= C. Жидкое стекло (macOS / visionOS 2025) ================= */
// Знаки 40×40, сплошные, геометрия как у SF Symbols
const SOLID = {
  courses: `<path d="M10 8a4 4 0 0 1 4-4h16v26H14a4 4 0 0 0-4 4z"/><path d="M10 34a4 4 0 0 0 4 4h16v-4H14" opacity=".55"/><path d="M23 4h5v11l-2.5-2-2.5 2z" opacity=".55"/>`,
  grades: `<rect x="7" y="22" width="7" height="13" rx="2.5" opacity=".55"/><rect x="16.5" y="14" width="7" height="21" rx="2.5" opacity=".75"/><rect x="26" y="5" width="7" height="30" rx="2.5"/>`,
  docs: `<path d="M11 4h11l9 9v20a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><path d="M22 4v6a3 3 0 0 0 3 3h6" opacity=".5"/><rect x="13" y="20" width="12" height="2.6" rx="1.3" fill="#000" opacity=".22"/><rect x="13" y="26" width="8" height="2.6" rx="1.3" fill="#000" opacity=".22"/>`,
  card: `<rect x="3" y="9" width="34" height="23" rx="5"/><circle cx="12" cy="18.5" r="3.6" fill="#000" opacity=".22"/><rect x="19" y="15.5" width="13" height="2.6" rx="1.3" fill="#000" opacity=".22"/><rect x="19" y="21" width="8" height="2.6" rx="1.3" fill="#000" opacity=".22"/><rect x="8" y="25.5" width="9" height="2.6" rx="1.3" fill="#000" opacity=".22"/>`,
  people: `<circle cx="15" cy="13" r="6"/><path d="M4 33c0-6.6 4.9-11 11-11s11 4.4 11 11z"/><circle cx="27" cy="12" r="4.6" opacity=".55"/><path d="M27.5 20c5.5 0 9 4 9 10H29c0-3.6-1.3-7-4-9.3z" opacity=".55"/>`,
  books: `<rect x="6" y="6" width="7" height="29" rx="2"/><rect x="15" y="10" width="7" height="25" rx="2" opacity=".72"/><rect x="25.5" y="8" width="7" height="27" rx="2" transform="rotate(-14 29 35)" opacity=".5"/>`,
};
const GLASS = [
  ["courses", "#8F8DF7", "#52BBAA"], ["grades", "#4FCB85", "#6AA9F2"], ["docs", "#B39BFB", "#6AA9F2"],
  ["card", "#8B8EFF", "#E58091"], ["people", "#E58091", "#E0A75E"], ["books", "#E0A75E", "#C69CF0"],
];
function glass([k, c1, c2]) {
  const b1 = id("b"), b2 = id("b"), clip = id("c"), sheen = id("s"), edge = id("e"), sym = id("y"), shd = id("d");
  const lights = `<circle cx="44" cy="34" r="24" fill="${c1}"/><circle cx="80" cy="70" r="20" fill="${c2}"/>`;
  return `<div class="face g"><svg viewBox="0 0 120 100" preserveAspectRatio="xMidYMid meet"><defs>
    <filter id="${b1}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="${b2}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15"/><feColorMatrix type="saturate" values="1.3"/></filter>
    <filter id="${shd}" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="${clip}"><rect x="32" y="22" width="56" height="56" rx="17"/></clipPath>
    <linearGradient id="${sheen}" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="${edge}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="${sym}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".82"/></linearGradient>
  </defs>
    <g class="light" opacity=".75"><g filter="url(#${b1})" opacity=".85">${lights}</g></g>
    <g class="plate">
      <rect x="32" y="22" width="56" height="56" rx="17" fill="#000" opacity=".01" filter="url(#${shd})"/>
      <g clip-path="url(#${clip})"><rect x="20" y="10" width="80" height="80" fill="#1B1B1E" opacity=".55"/><g filter="url(#${b2})">${lights}</g></g>
      <rect x="32" y="22" width="56" height="56" rx="17" fill="url(#${sheen})"/>
      <rect x="32.5" y="22.5" width="55" height="55" rx="16.5" fill="none" stroke="url(#${edge})" stroke-width="1"/>
      <g transform="translate(43 33) scale(.85)" fill="url(#${sym})">${SOLID[k]}</g>
    </g></svg></div>`;
}

const SECTIONS = [
  ["A", "Живые виджеты", "плитка показывает твои данные, а не картинку", widgets.map((f) => f)],
  ["B", "Точечная матрица", "монохромный знак из сетки точек, один акцент; волна при наведении", MAT.map((m, i) => () => matrix(m, i))],
  ["C", "Жидкое стекло", "стеклянная пластина над размытым цветным светом; пластина поднимается при наведении", GLASS.map((g) => () => glass(g))],
];
document.getElementById("root").innerHTML = SECTIONS.map(([k, name, note, set]) => `
  <section><h2>${k}. ${name} <small>${note}</small></h2>
  <div class="grid">${set.map((f, i) => `<div class="tile">${f()}<span class="lbl">${LABELS[i]}</span></div>`).join("")}</div></section>`).join("");
</script>
</body>
</html>
